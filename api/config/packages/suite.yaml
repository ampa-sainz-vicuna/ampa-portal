# Las aplicaciones de la suite y los roles que se pueden dar en cada una.
#
# Aquí y no en la base de datos a propósito: una aplicación o un rol nuevo
# llegan siempre con código nuevo en esa aplicación, así que se añaden aquí en
# el mismo momento (ver ApplicationCatalog).
#
# Qué SIGNIFICA cada rol lo decide cada aplicación, con el cliente del portal
# (cliente/README.md, "Roles"). Quitar un rol de aquí no borra los permisos
# que ya se hubieran dado: el portal dejaría de aceptarlo al guardar esa ficha.
#
# El orden es el de las tarjetas del portal. Las URLs cambian entre desarrollo
# y producción, por eso vienen de variables de entorno (api/.env).

parameters:
    suite.applications:
        fichajes:
            name: 'Fichajes'
            url: '%env(URL_FICHAJES)%'
            # El latido de las 4:00 la despierta (POST {url}/api/latido): cierra
            # el día y avisa de los días sin fichar aunque nadie entre.
            latido: true
            roles:
                # Además, fichajes exige un contrato en vigor: eso es suyo.
                empleado: 'Empleado'
                admin: 'Administración'
        listados:
            name: 'Listados'
            url: '%env(URL_LISTADOS)%'
            roles:
                usuario: 'Usuario'
        facturacion:
            name: 'Facturación'
            url: '%env(URL_FACTURACION)%'
            roles:
                usuario: 'Usuario'
        tareas:
            name: 'Tareas'
            url: '%env(URL_TAREAS)%'
            # El latido de las 4:00 la despierta: recurrentes, avisos de
            # vencimiento y resumen diario.
            latido: true
            roles:
                miembro: 'Miembro'
                # Además de miembro, no en su lugar: sin miembro no entra.
                admin: 'Administración (borra tareas ajenas)'
                # También además de miembro: ve y pone las de "solo la junta",
                # que los demás (el empleado) no ven.
                junta: 'Junta (ve las tareas de solo la junta)'
        # El código es "crm"; para la junta, "Proveedores" (29/09/2026).
        crm:
            name: 'Proveedores'
            url: '%env(URL_CRM)%'
            roles:
                miembro: 'Miembro'
                # Además de miembro, no en su lugar: sin miembro no entra.
                admin: 'Administración (borra proveedores y mantiene las categorías)'
        # Documentos (03/10/2026): las carpetas y los ficheros del AMPA en
        # Drive. Quien tenga algún rol en facturación, tareas o proveedores ve
        # además, en solo lectura, la unidad de esa aplicación.
        documentos:
            name: 'Documentos'
            url: '%env(URL_DOCUMENTOS)%'
            roles:
                miembro: 'Miembro (el espacio «AMPA»)'
                # Los dos, además de miembro, no en su lugar: sin miembro no entra.
                junta: 'Junta (además, el espacio «Junta»)'
                admin: 'Administración (manda carpetas enteras a la papelera)'
        # El propio portal: quien tiene "admin" gestiona los permisos de todas.
        portal:
            name: 'Portal'
            roles:
                admin: 'Gestiona los permisos'
