doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        profiling_collect_backtrace: '%kernel.debug%'

        # Cada value object con su tipo propio, como en el resto de la suite.
        # En DBAL 4 el nombre se asigna aquí: los tipos ya no llevan getName().
        types:
            user_id: App\Portal\Infrastructure\Persistence\Doctrine\Type\UserIdType
            email_address: App\Portal\Infrastructure\Persistence\Doctrine\Type\EmailAddressType
            grants: App\Portal\Infrastructure\Persistence\Doctrine\Type\GrantsType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        # El mapeo va en XML, fuera del dominio, para que las entidades no
        # lleven atributos de Doctrine encima (igual que fichajes y listados).
        auto_mapping: false
        mappings:
            Portal:
                type: xml
                is_bundle: false
                dir: '%kernel.project_dir%/src/Portal/Infrastructure/Persistence/Doctrine/Mapping'
                prefix: 'App\Portal\Domain'
                alias: Portal

when@test:
    doctrine:
        dbal:
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
