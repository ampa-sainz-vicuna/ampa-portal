# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters:
    # Cuánto dura una sesión, en segundos: una semana. Se entra con Google una
    # vez a la semana, no cada mañana.
    #
    # Alargarla no retrasa quitarle el acceso a nadie: cada aplicación pregunta
    # al portal en cada petición, y a una persona desactivada o sin permiso se
    # le cierra la puerta al momento aunque su token siga vigente. Lo que sí
    # alarga es cuánto vale una cookie robada de alguien que sigue activo.
    session.ttl: 604800

services:
    _defaults:
        autowire: true      # Inyecta las dependencias solo.
        autoconfigure: true # Registra comandos, suscriptores, etc.

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # El dominio no tiene servicios: son entidades y value objects, y
            # varios tienen el constructor privado. Si Symfony intentase
            # registrarlos, fallaría al compilar.
            - '../src/Portal/Domain/'

    # Cada puerto apunta a su implementación. Es el único sitio del proyecto
    # donde las dos capas se tocan.
    App\Portal\Domain\User\UserRepository: '@App\Portal\Infrastructure\Persistence\Doctrine\DoctrineUserRepository'
    App\Portal\Domain\Calendar\SchoolYearRepository: '@App\Portal\Infrastructure\Persistence\Doctrine\DoctrineSchoolYearRepository'
    App\Portal\Domain\Board\BoardMemberRepository: '@App\Portal\Infrastructure\Persistence\Doctrine\DoctrineBoardMemberRepository'
    App\Portal\Domain\Help\FaqRepository: '@App\Portal\Infrastructure\Persistence\Doctrine\DoctrineFaqRepository'
    App\Portal\Infrastructure\Security\IdentityVerifier: '@App\Portal\Infrastructure\Security\GoogleIdTokenVerifier'
    App\Portal\Infrastructure\Security\ServiceAccountVerifier: '@App\Portal\Infrastructure\Security\GoogleServiceAccountVerifier'

    # El único servicio de dominio (la regla de un titular por cargo): la carpeta
    # Domain/ está excluida del autowiring, así que se declara a mano.
    App\Portal\Domain\Board\SingleHolderRule: ~

    App\Portal\Domain\Suite\ApplicationCatalog:
        factory: ['App\Portal\Infrastructure\Suite\ApplicationCatalogFactory', 'fromConfig']
        arguments: ['%suite.applications%']

    App\Portal\Infrastructure\Security\GoogleIdTokenVerifier:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $hostedDomain: '%env(GOOGLE_HOSTED_DOMAIN)%'

    App\Portal\Infrastructure\Security\GoogleServiceAccountVerifier:
        arguments:
            $audience: '%env(SUITE_TOKEN_AUDIENCE)%'
            $accounts: '%env(SUITE_SERVICE_ACCOUNTS)%'

    # El latido diario (RunHeartbeat): cada paso, sin configurar, se salta.
    App\Portal\Application\Heartbeat\ApplicationWaker: '@App\Portal\Infrastructure\Heartbeat\HttpApplicationWaker'
    App\Portal\Application\Heartbeat\BackupLauncher: '@App\Portal\Infrastructure\Heartbeat\CloudRunBackupLauncher'
    App\Portal\Application\Heartbeat\DatabaseUsage: '@App\Portal\Infrastructure\Heartbeat\NeonDatabaseUsage'

    App\Portal\Infrastructure\Heartbeat\CloudRunBackupLauncher:
        arguments:
            $job: '%env(COPIAS_JOB)%'

    App\Portal\Infrastructure\Heartbeat\NeonDatabaseUsage:
        arguments:
            $projectId: '%env(NEON_PROJECT_ID)%'
            $apiKey: '%env(NEON_API_KEY)%'
            $hoursAllowed: '%env(float:NEON_COMPUTE_HOURS)%'

    App\Portal\Infrastructure\Security\SessionTokens:
        arguments:
            $key: '%env(JWT_KEY)%'
            $ttl: '%session.ttl%'

    App\Portal\Infrastructure\Security\SessionCookie:
        arguments:
            $domain: '%env(SESSION_COOKIE_DOMAIN)%'
            $secure: '%env(bool:SESSION_COOKIE_SECURE)%'

    # Quién puede leer GET /api/ayuda desde otra web: las aplicaciones del
    # catálogo, el propio portal y, en desarrollo, los Vite de cada una.
    App\Portal\Infrastructure\Http\HelpCors:
        arguments:
            $portalUrl: '%env(DEFAULT_URI)%'
            $extraOrigins: '%env(HELP_ALLOWED_ORIGINS)%'

when@test:
    services:
        # No hay forma de fabricar un token de Google firmado por Google: en
        # los tests, el token ES el correo (ver FakeIdentityVerifier).
        App\Portal\Infrastructure\Security\IdentityVerifier:
            class: App\Tests\Double\FakeIdentityVerifier

        # Ni el de las cuentas de servicio (ver FakeServiceAccountVerifier).
        App\Portal\Infrastructure\Security\ServiceAccountVerifier:
            class: App\Tests\Double\FakeServiceAccountVerifier

        # El latido no sale a la calle en los tests: ni Neon, ni Cloud Run, ni
        # las aplicaciones (ver los dobles). public: los tests los configuran.
        App\Portal\Application\Heartbeat\DatabaseUsage:
            class: App\Tests\Double\FakeDatabaseUsage
            public: true
        App\Portal\Application\Heartbeat\BackupLauncher:
            class: App\Tests\Double\FakeBackupLauncher
            public: true
        App\Portal\Application\Heartbeat\ApplicationWaker:
            class: App\Tests\Double\FakeApplicationWaker
            public: true
