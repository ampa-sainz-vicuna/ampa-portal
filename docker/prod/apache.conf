# Apache de producción: Symfony en /api, React en todo lo demás.

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        AllowOverride None
        Require all granted
    </Directory>

    # Apache no pasa la cabecera Authorization a PHP por defecto. En el portal
    # la usan /api/acceso y /api/avisos, que llaman los servidores de las
    # aplicaciones con el token de la cookie: sin esta línea, todas las
    # aplicaciones de la suite darían 401 a todo el mundo.
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1

    RewriteEngine On

    # 1. La API → el front controller de Symfony.
    RewriteRule ^/api(/.*)?$ /index.php [L]

    # 2. Un fichero que existe (JS, CSS, imágenes de React) → se sirve tal cual.
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} -f
    RewriteRule ^ - [L]

    # 3. Cualquier otra ruta → la app de React, que decide qué pantalla enseñar.
    RewriteRule ^ /index.html [L]

    # Los ficheros de /assets llevan un hash en el nombre (index-DhbdkKdr.js):
    # si cambian, cambia el nombre, así que el navegador puede guardarlos un año.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # index.html no: tiene que pedirse siempre, o tras un despliegue el navegador
    # seguiría cargando la versión anterior.
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Cloud Run recoge lo que se escribe en la salida estándar y de errores.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
