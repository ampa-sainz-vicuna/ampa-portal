; Configuración de PRODUCCIÓN (Cloud Run). La de desarrollo está en docker/php/.

; Igual que en desarrollo, para que el comportamiento no cambie al desplegar.
date.timezone = Europe/Madrid

; Los errores van al registro de Cloud Run, nunca a la pantalla del usuario.
display_errors = Off
log_errors = On
error_log = /dev/stderr
expose_php = Off

; El código no cambia dentro del contenedor: no hace falta revisar los ficheros
; en cada petición. Importa más aquí que en ninguna otra aplicación: cada
; petición de cada aplicación de la suite pasa por /api/acceso.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Nada de lo que hace el portal tarda: una petición atascada no debe dejar el
; contenedor ocupado.
max_execution_time = 30
