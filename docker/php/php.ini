; Configuración de DESARROLLO. La de producción (Cloud Run) irá aparte.
date.timezone = Europe/Madrid

display_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.validate_timestamps = 1
; Cada cuántos segundos mira PHP si un fichero ha cambiado. Con 0 lo mira en
; CADA petición, y sobre el disco de Windows eso son cientos de consultas
; lentas: medido el 24/09/2026, de ~2,5 s por petición a ~1-1,5 s. Un cambio
; en el código tarda como mucho 2 s en notarse.
opcache.revalidate_freq = 2
